<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kiorly Pharmacy — dispensing and inventory" />
    <meta name="theme-color" content="#3730A3" />
    <title>Kiorly Pharmacy by Kiorex</title>
    <script>/* Apply saved theme + language before first paint (no flash). Keys match src/brand/ui-kit.tsx and src/lib/i18n.ts. */
      (function () { try {
        var r = document.documentElement, p = localStorage.getItem("kx-theme") || "system";
        var d = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (d) r.classList.add("dark"); r.dataset.theme = d ? "dark" : "light"; r.style.colorScheme = d ? "dark" : "light";
        var l = localStorage.getItem("kiorly.lang"); if (l !== "en") l = "ar"; r.lang = l; r.dir = l === "ar" ? "rtl" : "ltr";
      } catch (e) {} })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
